<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전체 주기 백업 복원 검증</title>
<link rel="stylesheet" href="../dashboard.css">
<link rel="stylesheet" href="../backtest.css">
<link rel="stylesheet" href="../coin-favorites.css">
<style>
html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:#101a2a;color:#dfedff;font:14px/1.5 system-ui}.qa{flex:none;padding:12px 18px;background:#192a41}.qa h1{margin:0;font-size:20px}.qa p{margin:4px 0 8px}.qa button{font:inherit;padding:5px 12px}#qaResult{white-space:pre-wrap;color:#a4e5c9;margin:6px 0}#chartWorkspace{display:flex;flex:1;min-height:0;overflow:hidden}#chartGrid{flex:1;min-height:0;padding:10px;color:#a9c8ee}
</style>
<header class="qa">
 <h1>전체 주기 백업 복원 검증</h1>
 <p>개발 검증 전용 · 격리 저장소 · 저장 예제 173개 × 11주기 · 실제 시세나 투자 성과가 아닙니다.</p>
 <button id="qaStart">173개 전체 주기 복원 검증</button>
 <pre id="qaResult" role="status">대기 중</pre>
</header>
<main id="chartWorkspace"><div id="chartGrid">예제 차트 영역</div></main>
<script src="../timeframes.js"></script><script src="../funding.js"></script><script src="../indicators.js"></script>
<script src="../backtest-bars.js"></script><script src="../backtest-engine.js"></script><script src="../market-shared.js"></script>
<script src="../market-api.js"></script><script src="../backtest-data.js"></script><script src="../dashboard-model.js"></script>
<script src="../list-navigation.js"></script><script src="../coin-favorites.js"></script><script src="../coin-favorites-ui.js"></script>
<script src="../backtest-cache.js"></script><script src="../backtest-results.js"></script><script src="../backtest-backup.js"></script>
<script src="../backtest-batch.js"></script><script src="../backtest-batch-ui.js"></script><script src="../backtest-ui.js"></script>
<script src="../dashboard.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id),assert=(v,m)=>{if(!v)throw Error(m);},log=m=>{$('qaResult').textContent+='\n'+m;};
const frames=Object.keys(TimeframeEngine.seconds),count=173,markets=Array.from({length:count},(_,i)=>({exchange:i%2?'BINANCE':'BYBIT',symbol:'CROSS'+String(i+1).padStart(3,'0')+'USDT'}));
const beginning=Date.UTC(2009,0,1)/1000,actualStart=Date.UTC(2024,0,1)/1000,finish=Date.UTC(2024,4,1)/1000,basisId='chrome-all-173';
const cfg={...BacktestEngine.normalizeConfig({timeframe:'1m',startTime:beginning,endTime:finish,cacheRangeEnd:finish,rsiPeriod:7,rsiOversold:47,splitCount:0,initialCapital:7000,feePct:.12}),timeframe:'all'};
function waitFor(test,label){return new Promise((resolve,reject)=>{const obs=new MutationObserver(check),timer=setTimeout(()=>stop(Error(label+' 시간 초과: '+$('btBatchStatus')?.textContent)),12000);function stop(e){clearTimeout(timer);obs.disconnect();e?reject(e):resolve();}function check(){try{if(test())stop();}catch(e){stop(e);}}obs.observe($('chartWorkspace'),{attributes:true,subtree:true,childList:true,characterData:true});check();});}
function change(id,value){$(id).value=value;$(id).dispatchEvent(new Event('change',{bubbles:true}));}
async function restore(file){
 const input=$('btBatchImportFile'),data=new DataTransfer();data.items.add(file);input.files=data.files;input.dispatchEvent(new Event('change',{bubbles:true}));
 await waitFor(()=>!$('btBatchImport').disabled&&$('btBatchStatus').textContent.startsWith('데이터 복원 완료'),'확인창 없는 백업 복원');
 assert(!document.querySelector('dialog[open]')&&$('btBatchStatus').textContent.includes('즐겨찾기 173개 복원'),'목록을 자동으로 복원하지 않았습니다.');
}
async function confirmation(){
 const button=()=>[...document.querySelectorAll('dialog[open] button')].find(b=>b.textContent==='테스트 시작');
 await waitFor(button,'실행 확인');return button();
}
$('qaStart').onclick=async()=>{
 $('qaStart').disabled=true;$('qaResult').textContent='173개 원래 실행과 별도의 복원 저장소 준비 중…';
 const storageKeys=['funding-chart-backtest-panel-v1','funding-chart-backtest-strategy-v2','funding-chart-bt-restored-profile-v1','funding-chart-bt-run-options-v1'],previous=storageKeys.map(k=>localStorage.getItem(k));
 try{
  const source=BacktestCache.memory(),openJobs=BacktestCache.open,suffix='-cross-'+Date.now(),scopedDB={open:(name,version)=>indexedDB.open(name+suffix,version)};
  const dest=await openJobs({indexedDB:scopedDB}),details=await BacktestResults.open({indexedDB:scopedDB});assert(dest.persistent&&(await details.info()).persistent,'실제 IndexedDB 필요');
  const metaBase={config:cfg,startTime:actualStart,endTime:finish,source:'generated-test',gaps:0,fundingCoverage:{first:actualStart,last:finish-3600,count:100},snapshotByTimeframe:Object.fromEntries(frames.map(tf=>[tf,finish])),coverage:Object.fromEntries(frames.map(tf=>[tf,{first:actualStart,last:TimeframeEngine.shift(finish,tf,-1),count:100}]))};
  const items=markets.map((m,i)=>{
   const comparison=frames.map((tf,j)=>({timeframe:tf,totalTrades:j+1,netPnl:i/10+j,totalReturnPct:j/10,finalCapital:7000+i/10+j,maxDrawdownPct:3,riskRewardRatio:2,profitFactor:1.5,winRatePct:50,snapshotEnd:finish}));
   return {...m,status:'done',summary:{...comparison[3],timeframe:'all',bestTimeframe:frames[3]},meta:{...metaBase,market:{ex:m.exchange,symbol:m.symbol,int:'all'}},comparison};
  });
  const all={id:basisId,created:1,updated:1,status:'done',allHistory:true,config:cfg,items};
  await source.saveJob(all);
  await source.saveJob({...all,id:'newer-incomplete',updated:2,status:'paused',config:{...cfg,timeframe:'3m',rsiOversold:31},items:items.map((m,i)=>i?{exchange:m.exchange,symbol:m.symbol,status:'pending'}:{...m,meta:undefined})});
  const old={...all,id:'old-browser-139',updated:3,items:items.slice(0,139)};
  await source.saveJob(old);
  const keys=markets.map(m=>m.exchange+':'+m.symbol);
  const file=new File([await BacktestBackup.blob({...await source.exportAll(),favorites:keys})],'chrome-saved-all.dat');
  BacktestCache.open=async()=>dest;BacktestResults.getDefault=async()=>details;CoinFavorites.store=CoinFavorites.create();
  CoinFavorites.store.replace(keys.slice(0,139));await dest.saveJob(old);
  let workers=0,requests=0;window.Worker=function(){workers++;throw Error('복원된 결과에 계산 작업을 만들면 안 됩니다.');};MarketAPI.json=async()=>{requests++;throw Error('저장 결과에서 거래소 조회 발생');};
  localStorage.setItem(storageKeys[0],JSON.stringify({open:true,start:'2025-01-03',end:'2025-01-11',capital:20000,orderSize:25,commission:.05,slippage:.03,executionVersion:2}));
  localStorage.setItem(storageKeys[1],JSON.stringify({timeframe:'4h',rsiPeriod:14,rsiOversold:25,splitCount:5}));localStorage.setItem(storageKeys[2],old.id);localStorage.removeItem(storageKeys[3]);
  const chartWorkspace={activeMarket:()=>({ex:'BYBIT',symbol:markets[0].symbol,int:'4h'}),activeCell:()=>0,subscribe:()=>()=>{}};
  ChartDashboard.bind({workspace:$('chartWorkspace'),chartWorkspace,backtestData:{},selectMarket(){},onBacktestJump(){}});
  $('backtestMaximize').click();$('btView-batch').click();await waitFor(()=>$('btBatchImport')&&!$('btBatchImport').disabled,'일괄 화면 준비');
  await restore(file);
  assert(CoinFavorites.store.snapshot().size===173&&keys.every(k=>CoinFavorites.store.has(k))&&$('btBatchSavedJob').value===basisId,'복원한 173개 대신 예전 활성 작업을 열었습니다.');
  assert($('btBatchPlan').textContent.includes('173개')&&$('btBatchPlan').textContent.includes('5분할 · 최대 5회 진입 · RSI 25'),'복원 과정에서 현재 브라우저의 전략이 변경됐습니다.');
  log('139개 저장소에 173개 복원 · 139개가 파일의 마지막 선택이어도 173개를 엶 · 브라우저 5분할 유지');
  const times=[];
  for(const tf of ['all',...frames]){
   change('btBatchFrame',tf);const before=$('btBatchSavedJob').value,t=performance.now();$('btBatchUseSaved').click();
   const accept=await confirmation(),message=accept.closest('dialog').textContent;
   assert(message.includes('저장 결과 173개 재사용 · 새 계산 0개')&&message.includes('RSI 47')&&message.includes('7,000 USDT'),tf+'의 저장 결과 또는 전략을 놓쳤습니다.');
   accept.click();await waitFor(()=>!$('btBatchStart').disabled&&$('btBatchCount').textContent==='173 / 173'&&$('btBatchSavedJob').value!==before&&$('btBatchStatus').textContent.includes('173개 저장 결과 재사용'),tf+' 완료');
   times.push(performance.now()-t);const saved=await dest.activeJob();assert(saved.config.timeframe===tf&&saved.config.endTime===finish&&saved.sourceJobId===basisId&&saved.items.every(i=>i.meta.reuse.snapshotEnd===finish),tf+' 원래 실행 종료 시점이 바뀌었습니다.');
  }
  const reopened=await openJobs({indexedDB:scopedDB});
  assert((await reopened.getJob(basisId)).items.length===173&&(await reopened.listJobs()).length===3,'전체 주기 기록이 최근 개별 실행에 의해 삭제됐습니다.');
  log('전체 주기 + 개별 11주기: 매번 173/173 저장 결과 재사용 · 가장 느린 '+Math.max(...times).toFixed(1)+'ms');
  for(const [split,rsi] of [[5,25],[10,24]]){
   if(split===10){$('backtestSettings').click();$('btSplitCount').value='10';$('btRsiOversold').value='24';$('backtestSettingsForm').requestSubmit();assert(!$('backtestSettingsDialog').open,'10분할 저장 실패');}
   for(const tf of ['all',...frames]){
    change('btBatchFrame',tf);$('btBatchStart').click();
    const accept=await confirmation(),dialog=accept.closest('dialog');
    assert(dialog.textContent.includes('173개 거래소·코인')&&dialog.textContent.includes('저장 결과 0개 · 새 계산 173개')&&dialog.textContent.includes('현재 설정 · '+split+'분할 · 최대 '+split+'회 진입 / RSI '+rsi),tf+' · '+split+'분할 대신 예전 전략 또는 예전 목록을 선택했습니다.');
    [...dialog.querySelectorAll('button')].find(b=>b.textContent==='취소').click();
   }
  }
  assert(workers===0&&requests===0,'미리 보기 또는 완료 결과 재사용에 새 계산이나 거래소 요청이 발생했습니다.');
  let sent;window.Worker=function(){this.terminate=()=>{};this.postMessage=task=>{sent=task;this.onmessage?.({data:{id:task.id,progress:{phase:'prepare',timeframe:task.config.timeframe}}});};};
  change('btBatchFrame','all');$('btBatchStart').click();(await confirmation()).click();
  await waitFor(()=>sent&&$('btBatchCount').textContent==='0 / 173','현재 10분할 전체 주기 작업 전달');
  assert(sent.config.splitCount===10&&sent.config.rsiOversold===24&&sent.config.timeframe==='all'&&sent.config.initialCapital===20000&&sent.config.allocationPerTradePct===25,'Worker에 전달한 실제 전략이 다릅니다.');
  $('btBatchPause').click();await waitFor(()=>!$('btBatchStart').disabled,'검증 작업 중지');
  assert((await reopened.getJob(basisId)).items.length===173&&requests===0,'이전 전체 주기 결과가 손상됐습니다.');
  $('backtestSettings').click();$('btSplitCount').value='1';$('btRsiPeriod').value='7';$('btRsiOversold').value='47';
  const form=$('backtestSettingsForm');form.elements.capital.value='7000';form.elements.orderSize.value='100';form.elements.commission.value='.12';form.requestSubmit();
  assert(!$('backtestSettingsDialog').open,'현재 1회 진입 전략 설정 실패');
  change('btBatchPeriod','all');let unexpected=0;
  window.Worker=function(){unexpected++;throw Error('조건이 맞는 저장 결과에 Worker를 만들었습니다.');};
  const direct=[];
  for(const tf of ['all',...frames]){
   change('btBatchFrame',tf);const before=$('btBatchSavedJob').value,started=performance.now();$('btBatchStart').click();
   await waitFor(()=>!$('btBatchStart').disabled&&$('btBatchCount').textContent==='173 / 173'&&$('btBatchSavedJob').value!==before&&$('btBatchStatus').textContent.includes('173개 저장 결과 재사용'),'현재 설정으로 '+tf+' 즉시 표시');
   direct.push(performance.now()-started);
   assert(!document.querySelector('dialog[open]')&&unexpected===0,'일치하는 결과에 새 실행 확인 또는 Worker가 발생했습니다.');
   if(tf==='all')assert($('btBatchResults').querySelector('.bt-batch-best')?.textContent.includes('최고: '),'저장된 최고 주기 배지가 사라졌습니다.');
  }
  log('0분할 백업 → 현재 1회 진입으로 실행 · 전체 + 11주기마다 173/173 · 최대 '+Math.max(...direct).toFixed(1)+'ms · 새 Worker 0회');
  const added=['EXTRA1USDT','EXTRA2USDT','EXTRA3USDT'];CoinFavorites.store.replace([...keys.slice(0,170),...added.map(s=>'BYBIT:'+s)]);
  let finishFirst;const submitted=[];
  window.Worker=function(){this.terminate=()=>{};this.postMessage=task=>{
   submitted.push(task);const m=task.market,c=task.config,done=()=>this.onmessage?.({data:{id:task.id,output:{summary:items[0].comparison.find(r=>r.timeframe===c.timeframe),meta:{...metaBase,market:{ex:m.exchange,symbol:m.symbol,int:c.timeframe},config:c}}}});
   if(submitted.length===1){finishFirst=done;this.onmessage?.({data:{id:task.id,progress:{phase:'prepare',timeframe:c.timeframe}}});}else queueMicrotask(done);
  };};
  change('btBatchFrame','3m');$('btBatchStart').click();
  await waitFor(()=>finishFirst&&$('btBatchCount').textContent==='170 / 173','처음 170개 완료 먼저 표시');
  assert(!document.querySelector('dialog[open]')&&submitted.length===1,'저장한 170개가 재작업에 들어갔습니다.');
  finishFirst();await waitFor(()=>!$('btBatchStart').disabled&&$('btBatchCount').textContent==='173 / 173','없는 3개만 새 작업');
  assert(submitted.length===3&&submitted.every(t=>added.includes(t.market.symbol)&&t.config.splitCount===1&&t.config.timeframe==='3m')&&requests===0,'새 대상 또는 현재 설정이 달라졌습니다.');
  log('통과 · 170/173 먼저 표시 · 결과 없는 3개만 작업에 넘김 · 최고 주기 표시 유지');document.documentElement.dataset.qa='pass';
 }catch(error){log('실패 · '+error.message);document.documentElement.dataset.qa='fail';}
 finally{storageKeys.forEach((k,i)=>previous[i]===null?localStorage.removeItem(k):localStorage.setItem(k,previous[i]));}
};
</script>
</html>
