<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>원본 백업과 새 전략 검증</title>
<link rel="stylesheet" href="../dashboard.css"><link rel="stylesheet" href="../backtest.css"><link rel="stylesheet" href="../coin-favorites.css">
<style>
html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:#101a2a;color:#dfedff;font:14px/1.5 system-ui}.qa{flex:none;padding:12px 18px;background:#192a41}.qa h1{margin:0;font-size:20px}.qa p{margin:4px 0 8px}.qa button{font:inherit;padding:5px 12px}#qaResult{white-space:pre-wrap;color:#a4e5c9;margin:6px 0}#chartWorkspace{display:flex;flex:1;min-height:0;overflow:hidden}#chartGrid{flex:1;min-height:0;padding:10px;color:#a9c8ee}
</style>
<header class="qa"><h1>원본 백업과 새 전략 검증</h1><p>격리된 개발 검증 · 생성 예제 · 시장 시세나 투자 성과가 아닙니다.</p><button id="qaStart">원본 복원·전략 변경 검증</button><pre id="qaResult" role="status">대기 중</pre></header>
<main id="chartWorkspace"><div id="chartGrid">예제 차트 영역</div></main>
<script src="../timeframes.js"></script><script src="../funding.js"></script><script src="../indicators.js"></script><script src="../backtest-bars.js"></script>
<script src="../backtest-engine.js"></script><script src="../market-shared.js"></script><script src="../market-api.js"></script><script src="../backtest-data.js"></script>
<script src="../dashboard-model.js"></script><script src="../list-navigation.js"></script><script src="../coin-favorites.js"></script><script src="../coin-favorites-ui.js"></script>
<script src="../backtest-cache.js"></script><script src="../backtest-results.js"></script><script src="../backtest-backup.js"></script><script src="../backtest-archive.js"></script>
<script src="../backtest-research-store.js"></script><script src="../backtest-research.js"></script><script src="../backtest-research-file.js"></script><script src="../backtest-research-ui.js"></script>
<script src="../backtest-batch.js"></script><script src="../backtest-batch-ui.js"></script><script src="../backtest-ui.js"></script><script src="../dashboard.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id),assert=(ok,msg)=>{if(!ok)throw Error(msg);},log=t=>{$('qaResult').textContent+='\n'+t;};
const earliest=BacktestResearch.earliest,day=86400,start=Date.UTC(2025,0,1)/1000,end=Date.UTC(2026,0,1)/1000,m0={exchange:'BYBIT',symbol:'DEMO001USDT'};
const markets=Array.from({length:143},(_,i)=>({exchange:'BYBIT',symbol:'DEMO'+String(i+1).padStart(3,'0')+'USDT'}));
const strategy={rsiPeriod:6,rsiOversold:30,splitCount:10,entryTrigger:'rsi_oversold',splitTrigger:'step_pct',stopLossPct:0,maxHoldBars:24,allocationPerTradePct:10};
let requests=0,workerCount=0,overlay,frame='3m';
function waitFor(check,label,ms=20000){return new Promise((resolve,reject)=>{const obs=new MutationObserver(done),timer=setTimeout(()=>finish(Error(label+' 시간 초과 · '+$('btStatusMsg')?.textContent+' / '+$('btBatchStatus')?.textContent)),ms);function finish(e){obs.disconnect();clearTimeout(timer);e?reject(e):resolve();}function done(){try{if(check())finish();}catch(error){finish(error);}}obs.observe($('chartWorkspace'),{childList:true,attributes:true,characterData:true,subtree:true});done();});}
function select(id,value){$(id).value=value;$(id).dispatchEvent(new Event('change',{bubbles:true}));}
const batch=()=>$('btView-batch').click();
async function importFile(file,favoritesMode='keep'){
 batch();$('btBatchRestoreFavorites').value=favoritesMode;const control=$('btBatchImportFile'),transfer=new DataTransfer();transfer.items.add(file);control.files=transfer.files;control.dispatchEvent(new Event('change',{bubbles:true}));
 await waitFor(()=>!$('btBatchImport').disabled&&$('btBatchStatus').textContent.startsWith('데이터 복원 완료'),'파일 복원',30000);
}
function rows(from,to){return Array.from({length:(to-from)/60},(_,i)=>{const open=100+7*Math.sin((i-1)/23),close=100+7*Math.sin(i/23);return {time:from+i*60,open,high:Math.max(open,close)+.35,low:Math.min(open,close)-.35,close,volume:1+i%17+.000000012345678};});}
function funding(from,to){return Array.from({length:(to-from)/3600},(_,i)=>({time:from+i*3600,rate:i%8===0?-.61:-.025,intervalHours:1,intervalSource:'official-history',markPrice:100.0000001234}));}
function readySingle(){const s=$('btStatusMsg');if(s.classList.contains('bt-error'))throw Error(s.textContent);return s.textContent.startsWith('완료 ·')&&!$('btResearchRun').disabled;}
async function runOriginal(){const began=performance.now();$('btResearchRun').click();await waitFor(readySingle,'원본 새 계산');return performance.now()-began;}
function settings(split,rsi){$('backtestSettings').click();select('btSplitCount',String(split));$('btRsiOversold').value=String(rsi);$('backtestSettingsForm').requestSubmit();assert(!$('backtestSettingsDialog').open,'설정 저장 실패: '+$('backtestSettingsError').textContent);}
async function startBatch(expected,label){
 batch();const prev=$('btBatchSavedJob').value,confirm=()=>[...document.querySelectorAll('dialog[open] button')].find(b=>b.textContent==='테스트 시작');
 $('btBatchStart').click();await waitFor(confirm,'일괄 실행 확인창');const accept=confirm(),details=accept.closest('dialog').textContent;
 const began=performance.now();accept.click();
 await waitFor(()=>!$('btBatchStart').disabled&&$('btBatchCount').textContent===expected+' / '+expected&&$('btBatchSavedJob').value!==prev&&$('btBatchStatus').textContent.includes('전체 처리 완료'),label,45000);
 return {ms:performance.now()-began,details};
}
$('qaStart').onclick=async()=>{
 $('qaStart').disabled=true;$('qaResult').textContent='격리 저장소 준비 중…';
 const suffix='-qa-'+Date.now(),storageKeys=['funding-chart-backtest-panel-v1','funding-chart-backtest-strategy-v2','funding-chart-bt-research-only-v1','funding-chart-bt-restored-profile-v1'],previous=storageKeys.map(k=>localStorage.getItem(k));
 try{
  const jobStore=await BacktestCache.open({indexedDB:{open:(n,v)=>indexedDB.open(n+suffix,v)}}),results=await BacktestResults.open({name:'qa-result'+suffix});
  const raw=await BacktestResearchStore.open({dbName:'qa-raw'+suffix}),source=BacktestResearchStore.memory(),makeFile=async(legacy)=>{const parts=[];await BacktestResearchFile.write(source,legacy,{write:p=>parts.push(p)});return new File(parts,'generated-143-raw.dat');};
  assert(!(await raw.snapshot()).keys.length,'새 검증 환경의 원본 보관소가 비어 있어야 합니다.');
  const oldConfig={...BacktestEngine.normalizeConfig({...strategy,timeframe:'1m',startTime:earliest,endTime:end}),timeframe:'all'};
  const tinyRows=rows(end-3*day,end),tinyFunding=funding(end-5*day,end),three=TimeframeEngine.resample(tinyRows,'3m'),oldResult=BacktestEngine.runBacktest(three,tinyFunding,{...oldConfig,timeframe:'3m'},{equityMaxPoints:512});
  const archivedJob={id:'completed-all-139',updated:1,created:1,status:'done',allHistory:true,config:oldConfig,items:markets.slice(0,139).map(m=>({...m,status:'done',summary:{...oldResult.summary,timeframe:'all',bestTimeframe:'3m'},comparison:[{...oldResult.summary,timeframe:'3m'}]}))};
  const fragment=BacktestCache.memory(),fragmentBars=tinyRows.slice(-60),fragmentMarket=markets[1];
  await fragment.put(JSON.stringify(['candles-v3',fragmentMarket.exchange,fragmentMarket.symbol,'1m',fragmentBars[0].time,fragmentBars.at(-1).time]),{...BacktestCache.packCandles(fragmentBars),timeframe:'1m',closedVerified:true});
  const legacy={...await fragment.exportAll(),jobs:[archivedJob],favorites:markets.slice(0,139).map(m=>m.exchange+':'+m.symbol)};
  BacktestCache.open=async()=>jobStore;BacktestResearchStore.getDefault=async()=>raw;BacktestResults.getDefault=async()=>results;CoinFavorites.store=CoinFavorites.create();
  const NativeWorker=window.Worker;window.Worker=function(url,options){workerCount++;return new NativeWorker(String(url).includes('backtest-batch-worker')?'browser-research-fixture-worker.js?db='+encodeURIComponent(suffix):'../'+url,options);};MarketAPI.json=async()=>{requests++;throw Error('검증 중 예상하지 않은 거래소 요청');};
  localStorage.setItem(storageKeys[0],JSON.stringify({open:true,start:'2025-01-01',end:'2025-12-31',capital:10000,orderSize:10,commission:.05,slippage:.03,executionVersion:2}));localStorage.setItem(storageKeys[1],JSON.stringify(strategy));localStorage.setItem(storageKeys[2],'false');
  let notify;
  const workspace={activeMarket:()=>({ex:m0.exchange,symbol:m0.symbol,int:frame}),activeCell:()=>0,subscribe:cb=>{notify=cb;return()=>{};},setBacktest:o=>{overlay=o;}};
  ChartDashboard.bind({workspace:$('chartWorkspace'),chartWorkspace:workspace,backtestData:{},selectMarket(){},onBacktestJump(){}});
  $('backtestMaximize').click();batch();await waitFor(()=>$('btBatchStatus')&&!$('btBatchImport').disabled,'일괄 화면 준비');
  await importFile(new File([JSON.stringify(legacy)],'generated-old-139.dat'));
  assert($('btBatchPeriod').value==='all'&&$('btBatchFrame').value==='all','복원 후 전체 과거 또는 전체 주기 선택이 달라졌습니다.');
  settings(1,30);$('btBatchResearchOnly').click();$('btBatchStart').click();
  await waitFor(()=>$('btResearchPanel').open&&$('btBatchStatus').textContent.includes('원본 0 / 139개 준비'),'준비되지 않은 원본 검사');
  assert($('btBatchCount').textContent==='139 / 139'&&$('btBatchSavedJob').value===archivedJob.id&&workerCount===0&&requests===0&&(await jobStore.listJobs()).length===1,'원본이 없는데 기존 결과를 덮거나 새 검토를 시작했습니다.');
  log('기존 파일의 원본 조각만 있음 · 0/139 준비를 먼저 안내 · 완료 결과 139/139 유지');
  $('btBatchResearchOnly').click();settings(10,30);
  const saved=await startBatch(139,'기존 전체 주기 결과 재사용');
  assert(workerCount===0&&requests===0,'저장한 전체 주기 결과를 여는데 새 작업이 시작됐습니다.');
  log('기존 139개 전체 주기 · 전체 과거 유지 · 새 작업 0회 · '+saved.ms.toFixed(1)+'ms');

  $('qaResult').textContent+='\n원본 143개와 새 백업 파일 준비 중…';
  for(const [i,m] of markets.entries()){
   const lo=i?end-3*day:start,from=lo-2*day,bars=i?tinyRows:rows(lo,end),settled=i?tinyFunding:funding(from,end);
   await source.put(m,'candles',bars,{checked:[[lo,end]]});await source.put(m,'funding',settled,{checked:[[from,end]]});assert(await source.complete(m,{from:lo,to:end,fundingFrom:from}),'생성 예제 저장 실패');
  }
  const portable=await makeFile({...legacy,favorites:markets.map(m=>m.exchange+':'+m.symbol)});
  await importFile(portable,'replace');
  assert($('btBatchResearchOnly').checked&&$('btBatchPeriod').value==='all'&&(await raw.states()).length===143,'원본 파일·전체 과거 선택 복원 실패');
  log('새 파일 · 143개 실제 저장 블록을 빈 IndexedDB에 복원');
  settings(1,25);
  assert($('btBatchPlan').textContent.includes('1회 진입 · RSI 25'),'새 일괄 설정이 예전 10분할을 사용합니다.');
  const cold=await runOriginal();
  assert(overlay?.config.timeframe==='3m'&&overlay.config.rsiOversold===25&&overlay.config.splitCount===1&&overlay.trades.length>0&&overlay.trades.every(t=>t.entries.length===1),'선택한 3분봉·1회 진입·RSI 25 실제 적용 실패');
  const n=overlay.trades.length;settings(1,45);const warm=await runOriginal();
  assert(overlay.config.rsiOversold===45&&overlay.trades.length!==n,'새 RSI로 실제 결과가 바뀌지 않았습니다.');
  log('1년 예제 · 개별 3분봉 새 계산 '+cold.toFixed(1)+'ms · RSI만 변경 '+warm.toFixed(1)+'ms · '+n+' → '+overlay.trades.length+'건');
  frame='1h';notify?.();settings(1,25);const hour=await runOriginal();
  assert(overlay?.config.timeframe==='1h'&&overlay.config.splitCount===1,'1시간봉만 계산하지 못했습니다.');
  log('1시간봉으로 전환 후 새 계산 '+hour.toFixed(1)+'ms');

  batch();select('btBatchFrame','3m');
  const live=await startBatch(143,'143개 3분봉 원본 새 계산');
  const actual=await jobStore.activeJob();assert(live.details.includes('진입 1회')&&actual.config.splitCount===1&&actual.items.every(i=>i.meta.config.splitCount===1&&i.meta.market.int==='3m'&&i.meta.research),'실제 일괄 전략과 현재 설정 불일치');
  log('143개 · 3분봉·1회 진입·RSI 25 새 계산 '+live.ms.toFixed(1)+'ms');
  const trade=$('btBatchResults').querySelector('[data-batch-detail="0"]'),began=performance.now();trade.click();
  await waitFor(()=>$('btView-trades').getAttribute('aria-selected')==='true'&&!$('btRunBtn').disabled,'거래 보기');
  log('새로 계산한 코인 거래 보기 '+(performance.now()-began).toFixed(1)+'ms');
  const again=await startBatch(143,'143개 동일 원본·설정 재사용');assert((await jobStore.activeJob()).items.every(i=>i.meta.reuse),'같은 원본·조건을 다시 계산했습니다.');log('143개 동일 조건 재사용 '+again.ms.toFixed(1)+'ms');

  const written=[];let closed=false;window.showSaveFilePicker=async()=>({createWritable:async()=>({write:p=>written.push(p),close:()=>{closed=true;},abort:()=>{written.length=0;}})});
  $('btResearchPanel').open=true;await waitFor(()=>!$('btResearchExport').disabled,'원본 포함 백업 버튼');$('btResearchExport').click();
  await waitFor(()=>closed&&!$('btResearchExport').disabled&&$('btResearchStatus').textContent.includes('원본 포함 백업 저장 완료'),'실제 원본 포함 백업');
  const transferred=await BacktestResearchStore.open({dbName:'qa-raw-export'+suffix}),exported=await BacktestResearchFile.restore(new Blob(written),transferred);
  assert(exported.markets===143&&(await transferred.state(m0)).signature===(await raw.state(m0)).signature&&exported.legacy.jobs.some(j=>j.config.splitCount===1),'새 파일의 원본 또는 실행 설정을 다시 열 수 없습니다.');
  log('원본 포함 백업 버튼 → 별도 저장소 재복원 · 143개 원본과 실제 실행 설정 유지');
  assert(requests===0,'보관 원본 계산에서 거래소에 요청했습니다.');
  log('통과 · 모든 복원·계산에서 거래소 요청 0회');document.documentElement.dataset.qa='pass';
 }catch(error){log('실패 · '+error.message);document.documentElement.dataset.qa='fail';}
 finally{storageKeys.forEach((k,i)=>previous[i]===null?localStorage.removeItem(k):localStorage.setItem(k,previous[i]));}
};
</script>
</html>
