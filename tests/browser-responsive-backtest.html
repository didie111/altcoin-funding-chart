<!doctype html><html lang="ko"><meta charset="utf-8"><title>반응형 백테스트 검증</title><style>body{margin:0;background:#091320;color:#deebff;font:13px/1.6 system-ui}header{padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{font:inherit;color:#deebff;background:#203750;border:1px solid #52759b;padding:7px;border-radius:5px}#stage{margin:0 16px;transform-origin:top left}iframe{display:block;border:1px solid #587997;transform-origin:top left}#result{white-space:pre-wrap;padding:8px 16px;margin:0}.pass{color:#85e2b6}</style><header><strong>생성 예제 · 화면 크기별 검증</strong><label>화면<select id="size"><option value="1366,768">노트북1366×768</option><option value="1280,600">작은 노트북1280×600</option><option value="1920,1080">PC1920×1080</option><option value="390,844">휴대폰390×844</option></select></label><button id="run">4가지 화면 자동 검증</button></header><div id="stage"><iframe id="app" src="browser-responsive-backtest-inner.html" width="1366" height="768" title="검증용 실제 백테스팅 UI"></iframe></div><pre id="result">준비 중</pre><script>
const f=document.getElementById('app'),stage=document.getElementById('stage'),size=document.getElementById('size'),result=document.getElementById('result'),settle=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
function fit(){const [w,h]=size.value.split(',').map(Number),scale=Math.min(1,(innerWidth-32)/w,(innerHeight-115)/h);f.width=w;f.height=h;f.style.transform='scale('+scale+')';stage.style.width=w*scale+'px';stage.style.height=h*scale+'px';}size.onchange=fit;addEventListener('resize',fit);f.onload=()=>{fit();result.textContent='준비 완료 · 각 화면의 목록을 스크롤해도 38 / 138이 보입니다.';};fit();
document.getElementById('run').onclick=async()=>{const lines=[];try{for(const value of ['1366,768','1280,600','1920,1080','390,844']){size.value=value;fit();await settle();const d=f.contentDocument,monitor=d.querySelector('.bt-batch-monitor'),list=d.querySelector('.bt-batch-content'),count=d.getElementById('btBatchCount'),dock=d.getElementById('backtestDock');if(!list||!count)throw Error('UI 초기화 실패');const before=count.getBoundingClientRect();list.scrollTop=list.scrollHeight;await settle();const after=count.getBoundingClientRect(),mr=monitor.getBoundingClientRect(),lr=list.getBoundingClientRect(),dr=dock.getBoundingClientRect();if(Math.abs(before.top-after.top)>1||mr.bottom>lr.top+1||after.bottom>dr.bottom||!count.textContent.includes('38 / 138'))throw Error(value+' 진행 숫자가 가려집니다.');const ancestors=[];for(let e=list;e&&e!==d.body;e=e.parentElement){const c=f.contentWindow.getComputedStyle(e);if(/auto|scroll/.test(c.overflowY)&&e.scrollHeight>e.clientHeight+2)ancestors.push(e);}if(ancestors.length!==1)throw Error(value+' 세로 스크롤 중첩 '+ancestors.length);if(value.startsWith('390')&&f.contentWindow.getComputedStyle(d.querySelector('tbody>tr')).display!=='grid')throw Error('휴대폰 카드 배치 미적용');if(list.clientHeight<100)throw Error(value+' 결과 영역이 너무 작습니다.');lines.push('통과 · '+value.replace(',','×')+' · 고정 숫자 · 단일 스크롤 · 결과 영역 '+list.clientHeight+'px');list.scrollTop=0;}size.value='1366,768';fit();result.textContent=lines.join('\n');result.className='pass';}catch(e){result.textContent=lines.join('\n')+'\n실패 · '+e.message;}};
</script></html>
