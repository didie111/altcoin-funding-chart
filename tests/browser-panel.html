<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>개발 검증 · 목록 위치와 브라우저 저장</title><link rel="stylesheet" href="../funding-archive.css"><link rel="stylesheet" href="../coin-favorites.css"><style>body{background:#0d1727;color:#dceaff;font:14px system-ui;margin:20px}button{cursor:pointer;padding:10px}main{display:flex;gap:20px;align-items:flex-start}#signal-sidebar{width:370px;height:780px;display:flex;flex-direction:column;border:1px solid #4d6c91}#tab-funding-history{display:flex;flex-direction:column;flex:1;min-height:0}.pass{color:#7de0ad}.fail{color:#ff9fa9}li{margin-bottom:10px}pre{white-space:pre-wrap}#qaResults{max-width:620px;line-height:1.8}</style><h1>개발 검증 · 예제 자료</h1><p>실제 컴포넌트의 페이지·스크롤·정산 날짜 이동을 검증합니다. 이 화면의 기록은 개발 검증 전용입니다.</p><button id="runTests">브라우저 통합 검증 실행</button><main><section id="signal-sidebar"><nav class="sidebar-tab-bar"></nav></section><section id="qaResults" aria-live="polite">검증 준비 중…</section></main><script src="../funding.js"></script><script src="../timeframes.js"></script><script src="../indicators.js"></script><script src="../backtest-bars.js"></script><script src="../backtest-engine.js"></script><script src="../funding-archive.js"></script><script src="../dashboard-model.js"></script><script src="../list-navigation.js"></script><script src="../backtest-cache.js"></script><script src="../funding-archive-ui.js"></script><script>
(async()=>{const base=1793300000,mem=FundingArchive.memoryStore(),run={id:'qa-records',key:'qa',status:'done',to:base,markets:[]};for(let i=0;i<160;i++){const market={exchange:'BITGET',symbol:i===78?'AKEUSDT':'COIN'+String(i).padStart(3,'0')+'USDT'};run.markets.push(market);const records=Array.from({length:110},(_,j)=>({time:base-i*360000-j*3600,rate:-.6,hours:1,source:'official-history'}));await mem.save(run.id,market,{status:'done',first:records.at(-1).time,last:records[0].time},records);}mem.getRun=async()=>run;FundingArchive.storage=async()=>mem;let jumps=0;FundingArchiveUI.bind({document,page(){},catalog:{load:async()=>({rows:[]})},loadMarket(m){jumps++;document.getElementById('qaResults').dataset.lastJump=m.symbol;}});const $=id=>document.getElementById(id),settle=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve))),check=(condition,text)=>{if(!condition)throw Error(text);return '<li class="pass">통과 · '+text+'</li>';};await settle();$('qaResults').textContent='준비 완료 · 160개 코인, AKE는 2페이지에 있습니다.';
$('runTests').onclick=async()=>{const results=[];try{document.querySelector('.fh-filters').open=false;$('fhCoinsView').dispatchEvent(new MouseEvent('dblclick',{bubbles:true}));await settle();$('fhNext').click();await settle();const list=$('fhResults'),ake=list.querySelector('[data-list-key="BITGET:AKEUSDT"]');if(!ake)throw Error('2페이지 AKE 찾기');list.scrollTop+=ake.getBoundingClientRect().top-list.getBoundingClientRect().top-25;list.dispatchEvent(new Event('scroll'));await settle();const before=list.scrollTop;ake.querySelector('button').click();await settle();list.querySelector('.fh-record button').click();$('fhCoinsView').click();await settle();results.push(check($('fhPage').textContent==='2페이지'&&Math.abs(list.scrollTop-before)<2,'AKE 정산 날짜 이동 후 코인 목록 2페이지·스크롤 위치 유지 ('+Math.round(before)+'px → '+Math.round(list.scrollTop)+'px)'));results.push(check(jumps>0,'정산 날짜 이동 콜백 실행'));$('fhRecordsView').click();await settle();$('fhNext').click();await settle();list.scrollTop=240;list.dispatchEvent(new Event('scroll'));await settle();const recordScroll=list.scrollTop;$('fhCoinsView').click();await settle();$('fhRecordsView').click();await settle();results.push(check($('fhPage').textContent==='2페이지'&&Math.abs(list.scrollTop-recordScroll)<2,'코인별 정산 기록 페이지·스크롤 독립 보존'));$('fhRecordsView').dispatchEvent(new MouseEvent('dblclick',{bubbles:true}));await settle();results.push(check($('fhPage').textContent==='1페이지'&&list.scrollTop===0,'정산 기록 더블클릭: 첫 페이지 맨 위'));$('fhCoinsView').click();await settle();$('fhCoinsView').dispatchEvent(new MouseEvent('dblclick',{bubbles:true}));await settle();results.push(check($('fhPage').textContent==='1페이지'&&list.scrollTop===0,'코인 목록 더블클릭: 첫 페이지 맨 위'));$('fhNext').click();await settle();$('fhTop').click();await settle();results.push(check($('fhPage').textContent==='1페이지'&&list.scrollTop===0,'터치용 맨 위 버튼도 동일하게 작동'));
const dbName='qa-'+Date.now(),store=await BacktestCache.open({indexedDB:{open:(n,v)=>indexedDB.open(n+'-'+dbName,v)},limit:80});await store.put('a',[1],{bytes:35,expires:Date.now()+60000});await new Promise(r=>setTimeout(r,5));await store.put('b',[2],{bytes:35,expires:Date.now()+60000});await new Promise(r=>setTimeout(r,5));await store.get('a');await new Promise(r=>setTimeout(r,5));await store.put('c',[3],{bytes:35,expires:Date.now()+60000});const info=await store.info();results.push(check(info.persistent&&info.bytes<=80&&await store.get('b')===null&&JSON.stringify(await store.get('a'))==='[1]','실제 IndexedDB: 80바이트 한도·LRU 삭제·데이터 재사용'));for(let i=0;i<5;i++)await store.saveJob({id:'qa-'+i,updated:i,status:'done',items:[]});results.push(check((await store.latestJob()).id==='qa-4','실제 IndexedDB: 최신 완료 결과 저장·복원'));$('qaResults').innerHTML='<h2>통합 검증 '+results.length+'개 통과</h2><ol>'+results.join('')+'</ol>';}catch(error){$('qaResults').innerHTML='<h2 class="fail">검증 실패</h2><ol>'+results.join('')+'</ol><pre class="fail">'+String(error.stack)+'</pre>';}};})();
</script></html>
