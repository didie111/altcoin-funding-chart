<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>완료한 일괄 백테스트 복원 검증</title>
<link rel="stylesheet" href="../dashboard.css">
<link rel="stylesheet" href="../backtest.css">
<link rel="stylesheet" href="../coin-favorites.css">
<style>
html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:#101a2a;color:#dfedff;font:14px/1.5 system-ui}.qa{flex:none;padding:12px 18px;background:#192a41}.qa h1{margin:0;font-size:20px}.qa p{margin:4px 0 8px}.qa button{font:inherit;padding:5px 12px}#qaResult{white-space:pre-wrap;color:#a4e5c9;margin:6px 0}#chartWorkspace{display:flex;flex:1;min-height:0;overflow:hidden}#chartGrid{flex:1;min-height:0;padding:10px;color:#a9c8ee}
</style>
<header class="qa">
 <h1>완료한 일괄 결과 복원 검증</h1>
 <p>개발 검증 전용 · 격리 저장소 · 생성 예제 139개 · 실제 시세나 투자 성과가 아닙니다.</p>
 <button id="qaStart">139개 복원·실행 검증</button>
 <pre id="qaResult" role="status">대기 중</pre>
</header>
<main id="chartWorkspace"><div id="chartGrid">예제 차트 영역</div></main>
<script src="../timeframes.js"></script><script src="../funding.js"></script><script src="../indicators.js"></script>
<script src="../backtest-bars.js"></script><script src="../backtest-engine.js"></script><script src="../market-shared.js"></script>
<script src="../market-api.js"></script><script src="../backtest-data.js"></script><script src="../dashboard-model.js"></script>
<script src="../list-navigation.js"></script><script src="../coin-favorites.js"></script><script src="../coin-favorites-ui.js"></script>
<script src="../backtest-cache.js"></script><script src="../backtest-results.js"></script><script src="../backtest-backup.js"></script>
<script src="../backtest-batch.js"></script><script src="../backtest-batch-ui.js"></script><script src="../backtest-ui.js"></script>
<script src="../dashboard.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id),assert=(v,msg)=>{if(!v)throw Error(msg);},log=msg=>{$('qaResult').textContent+='\n'+msg;};
const count=139,exchange='BYBIT',markets=Array.from({length:count},(_,i)=>({exchange,symbol:'DEMO'+String(i+1).padStart(3,'0')+'USDT'}));
const strategy={rsiPeriod:6,rsiOversold:50,entryTrigger:'rsi_oversold',splitCount:1,maxHoldBars:24,allocationPerTradePct:10};
const start=Date.UTC(2025,0,1)/1000,end=start+30*86400,config=BacktestEngine.normalizeConfig({...strategy,timeframe:'1m',startTime:Date.UTC(2009,0,1)/1000,endTime:end,cacheRangeEnd:'latest'});
const pending=markets.map(m=>({...m,status:'pending'})),batchId='backup-completed-139';
let workers=0,requests=0,lastOverlay=null;
function waitFor(check,stage){return new Promise((resolve,reject)=>{const observer=new MutationObserver(finish),timer=setTimeout(()=>done(Error(stage+' 시간 초과: '+$('btStatusMsg')?.textContent+' / '+$('btBatchStatus')?.textContent)),10000);function done(error){clearTimeout(timer);observer.disconnect();error?reject(error):resolve();}function finish(){try{if(check())done();}catch(error){done(error);}}observer.observe($('chartWorkspace'),{childList:true,characterData:true,subtree:true,attributes:true});finish();});}
function requireSuccess(){if($('btStatusMsg').classList.contains('bt-error'))throw Error($('btStatusMsg').textContent);return !$('btRunBtn').disabled;}
const showBatch=()=>$('btView-batch').click(),tab=name=>$('btView-'+name).getAttribute('aria-selected')==='true';
function select(id,value){$(id).value=value;$(id).dispatchEvent(new Event('change',{bubbles:true}));}
function row(index){return $('btBatchResults').querySelector('[data-batch-detail="'+index+'"]');}
async function importFile(file){
 showBatch();const input=$('btBatchImportFile'),data=new DataTransfer();data.items.add(file);input.files=data.files;input.dispatchEvent(new Event('change',{bubbles:true}));
 await waitFor(()=>!$('btBatchImport').disabled&&$('btBatchStatus').textContent.startsWith('데이터 복원 완료'),'백업 복원');
 assert($('btBatchSavedJob').value===batchId&&$('btBatchCount').textContent==='139 / 139'&&$('btBatchFrame').value==='1m'&&$('btBatchPeriod').value==='all','파일의 1분봉 139개를 열지 않았습니다.');
}
async function rerun(tf){
 showBatch();const previous=$('btBatchSavedJob').value,label=DashboardModel.labels[tf];select('btBatchFrame',tf);$('btBatchStart').click();const accept=[...document.querySelectorAll('dialog[open] button')].find(b=>b.textContent==='테스트 시작');assert(accept,'실행 확인창 없음');
 const begin=performance.now();accept.click();await waitFor(()=>!$('btBatchStart').disabled&&$('btBatchCount').textContent==='139 / 139'&&$('btBatchStatus').textContent.includes('139개 저장 결과 재사용')&&$('btBatchSavedJob').value!==previous&&$('btBatchSavedJob').selectedOptions[0]?.textContent.startsWith(label+' ·'),'저장 실행의 '+tf+' 재사용');
 log('139개 '+DashboardModel.labels[tf]+' 재실행: '+(performance.now()-begin).toFixed(1)+'ms');
}
$('qaStart').onclick=async()=>{
 $('qaStart').disabled=true;$('qaResult').textContent='예제 데이터와 백업 파일 준비 중…';
 const suffix='-qa-restored-run-'+Date.now(),qaDB={open:(name,version)=>indexedDB.open(name+suffix,version)},openJobs=BacktestCache.open,openResults=BacktestResults.open;
 const storageKeys=['funding-chart-backtest-panel-v1','funding-chart-backtest-strategy-v2'],previous=storageKeys.map(k=>localStorage.getItem(k));
 try{
  const source=BacktestResults.memory(),jobs=await openJobs({indexedDB:qaDB}),results=await openResults({indexedDB:qaDB});assert(jobs.persistent&& (await results.info()).persistent,'IndexedDB 저장 불가');
  const minute=Array.from({length:(end-start)/60},(_,i)=>{const close=100+6*Math.sin(i/10);return {time:start+i*60,open:close,high:close+.5,low:close-.5,close,volume:10+i%7};});
  const funding=Array.from({length:30*24+48},(_,i)=>({time:start+(i-48)*3600,rate:i%4===0?-.6:-.01,intervalHours:1,intervalSource:'official-history'})),items=[];
  for(const tf of ['1m','3m']){
   const candles=tf==='1m'?minute:TimeframeEngine.resample(minute,tf),result=BacktestEngine.runBacktest(candles,funding,{...config,timeframe:tf},{equityMaxPoints:BacktestResults.equityPoints});assert(result.success&&result.trades.length>100,'거래 예제가 충분하지 않습니다.');
   for(const [i,m] of markets.entries()){
    const meta={market:{ex:exchange,symbol:m.symbol,int:tf},coverage:{[tf]:{first:start,last:candles.at(-1).time,count:candles.length}},fundingCoverage:{first:funding[0].time,last:funding.at(-1).time,count:funding.length},startTime:start,endTime:end,gaps:0,source:'generated-browser-fixture',config:result.config};
    if(tf==='1m')items.push({...m,status:'done',summary:result.summary,meta});
    // One row represents a legacy summary-only result. Its 3m details do exist separately.
    if(tf!=='1m'||i!==1)assert(await source.save(m,config,result,meta),'예제 완료 결과를 저장하지 못했습니다.');
   }
  }
  const completed={id:batchId,created:1,updated:1,status:'done',config,items,allHistory:true};
  const oldFile=new File([await BacktestBackup.blob({version:1,app:'funding-chart-batch-v1',exportedAt:2,pages:[],jobs:[completed],favorites:markets.map(m=>exchange+':'+m.symbol),completedResults:await source.exportAll()})],'generated-139-legacy.dat');
  const blank=(id,tf,updated)=>({id,status:'paused',updated,items:pending,config:{...config,timeframe:tf},allHistory:true});
  await jobs.saveJob(blank('newer-empty-3m','3m',5));await jobs.saveJob(blank('newer-empty-1m','1m',6));
  BacktestCache.open=async()=>jobs;BacktestResults.getDefault=async()=>results;CoinFavorites.store=CoinFavorites.create();
  window.Worker=function(){workers++;throw Error('저장된 자료를 열 때 계산 작업이 시작됐습니다.');};MarketAPI.json=async()=>{requests++;throw Error('저장 자료의 원본 재조회');};
  localStorage.setItem(storageKeys[0],JSON.stringify({open:true,start:'2025-01-10',end:'2025-01-20',capital:10000,orderSize:10,commission:.05,slippage:.03,executionVersion:2}));
  localStorage.setItem(storageKeys[1],JSON.stringify(strategy));
  const chartWorkspace={activeMarket:()=>({ex:exchange,symbol:markets[0].symbol,int:'1m'}),activeCell:()=>0,subscribe:()=>()=>{},setBacktest:value=>{lastOverlay=value;}};
  ChartDashboard.bind({workspace:$('chartWorkspace'),chartWorkspace,backtestData:{},selectMarket(){},onBacktestJump(){}});
  $('backtestMaximize').click();showBatch();await waitFor(()=>$('btBatchSavedJob').value==='newer-empty-1m','새로운 빈 실행 확인');
  assert($('btBatchCount').textContent==='0 / 139','빈 실행 재현 실패');await importFile(oldFile);
  $('qaResult').textContent='구형 백업 복원: 더 최신의 빈 실행 대신 원본 1분봉 139/139 선택';

  let begin=performance.now();$('btRunBtn').click();await waitFor(()=>requireSuccess()&&$('btStatusMsg').textContent.includes('완료 · 저장 결과'),'개별 실행');
  assert(lastOverlay?.market.symbol===markets[0].symbol&&lastOverlay.trades.length===items[0].summary.totalTrades,'개별 결과 거래 배열 불일치');
  assert(!$('btResultContext').hidden&&$('btResultContext').textContent.includes('현재 설정 기간'), '다른 설정 기간 안내 없음');
  const individual=performance.now()-begin;assert(individual<1000,'개별 실행이 1초를 넘겼습니다.');log('개별 1분봉 실행: '+individual.toFixed(1)+'ms · 원래 거래 '+lastOverlay.trades.length+'건');

  showBatch();begin=performance.now();row(0).click();await waitFor(()=>requireSuccess()&&tab('trades'),'일괄 거래 보기');
  assert($('btReport').querySelectorAll('tbody tr').length===100,'저장된 거래 표가 표시되지 않았습니다.');const tradeView=performance.now()-begin;assert(tradeView<1000,'거래 보기가 1초를 넘겼습니다.');log('일괄 거래 보기: '+tradeView.toFixed(1)+'ms · 첫 페이지 100건 표시');
  showBatch();row(1).click();await waitFor(()=>requireSuccess()&&tab('overview')&&!!$('btBuildSavedDetails'),'요약만 있는 구형 거래 보기');
  assert($('btExportCsv').disabled&&$('btShowChart').disabled&&!$('btBuildSavedDetails').disabled&&$('btReport').textContent.includes(items[1].summary.totalTrades+'회'),'구형 요약 상세 표시 오류');log('구형 요약: 즉시 표시 · 상세 만들기는 별도 버튼');

  await rerun('3m');await rerun('1m');select('btBatchSavedJob',batchId);await waitFor(()=>$('btBatchCount').textContent==='139 / 139'&&$('btBatchSavedJob').value===batchId&&$('btBatchFrame').value==='1m','보관 실행 전환');
  await jobs.saveJob(blank('later-empty-3m','3m',Date.now()+1000));await importFile(oldFile);
  const reopened=await openJobs({indexedDB:qaDB}),active=await reopened.activeJob();assert(active.id===batchId&&active.items.every(i=>i.status==='done')&&active.config.endTime===end,'재연결 후 복원 완료 기록 손실');
  assert(workers===0&&requests===0,'원본 요청 또는 새 작업 발생');log('같은 파일 재복원 및 저장소 다시 열기: 원본 1분봉 139/139 유지');log('통과 · 원본 요청 0회 · 새 Worker 0회');document.documentElement.dataset.qa='pass';
 }catch(error){log('실패 · '+error.message);document.documentElement.dataset.qa='fail';}
 finally{for(const [i,k] of storageKeys.entries())previous[i]===null?localStorage.removeItem(k):localStorage.setItem(k,previous[i]);}
};
</script>
</html>
