<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알트코인 실시간 & 과거 통합 펀딩비 차트</title>
    <!-- TradingView Lightweight Charts v4 CDN -->
    <script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: #111827;
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #1f2937;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid #374151;
            flex-wrap: wrap;
            z-index: 20;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        label {
            font-size: 11px;
            color: #9ca3af;
            font-weight: 600;
        }
        input, select, button {
            background-color: #374151;
            color: #ffffff;
            border: 1px solid #4b5563;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
        }
        input[type="text"] {
            width: 100px;
            text-transform: uppercase;
            font-weight: bold;
        }
        input[type="number"] {
            width: 95px;
        }
        button {
            cursor: pointer;
            background-color: #2563eb;
            border: none;
            font-weight: 600;
            padding: 6px 12px;
        }
        button:hover { background-color: #1d4ed8; }
        .btn-toggle {
            background-color: #4b5563;
            color: #d1d5db;
            font-weight: 700;
            padding: 6px 10px;
            min-width: 36px;
            border-radius: 6px;
        }
        .btn-toggle.active { background-color: #10b981; color: #fff; }
        #status-msg { font-size: 12px; color: #10b981; font-weight: 600; }
        #status-msg.error { color: #f87171; }

        /* 메인 레이아웃 */
        #main-wrapper {
            flex: 1;
            display: flex;
            width: 100%;
            height: calc(100vh - 60px);
            overflow: hidden;
        }

        #chart-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            background: #111827;
        }
        #price-chart-wrapper {
            flex: 7;
            width: 100%;
            position: relative;
        }
        #price-chart {
            width: 100%;
            height: 100%;
        }
        #vertical-line-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        #funding-chart {
            flex: 3;
            width: 100%;
            border-top: 1px solid #374151;
            position: relative;
        }

        /* 신호 목록 사이드바 */
        #signal-sidebar {
            width: 310px;
            background-color: #1f2937;
            border-left: 1px solid #374151;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        .sidebar-header {
            padding: 12px 14px;
            background-color: #111827;
            border-bottom: 1px solid #374151;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-header span {
            background-color: #2563eb;
            color: #fff;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
        }
        .signal-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .signal-item {
            background-color: #374151;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.15s ease;
            border-left: 5px solid #3b82f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .signal-item:hover {
            background-color: #4b5563;
            transform: translateX(-3px);
        }
        .signal-item.EXTREME {
            border-left-color: #a855f7;
            background-color: rgba(168, 85, 247, 0.15);
        }
        .signal-item.WARN {
            border-left-color: #ef4444;
            background-color: rgba(239, 68, 68, 0.15);
        }
        .signal-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .signal-date {
            font-size: 11px;
            color: #d1d5db;
            font-weight: 600;
        }
        .signal-rate {
            font-size: 13px;
            font-weight: 800;
        }
        .signal-rate.EXTREME { color: #c084fc; }
        .signal-rate.WARN { color: #f87171; }
        .btn-move {
            background-color: #2563eb;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .btn-move:hover { background-color: #1d4ed8; }

        .chart-label {
            position: absolute;
            top: 8px;
            left: 12px;
            z-index: 10;
            font-size: 11px;
            font-weight: 700;
            color: #9ca3af;
            background: rgba(17, 24, 39, 0.85);
            padding: 3px 8px;
            border-radius: 4px;
            pointer-events: none;
        }
        .legend-tag {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 4px;
        }
    #main-wrapper {min-height:0;height:auto} #chart-container {min-width:0} @media(max-width:800px){#signal-sidebar{width:210px} header{padding:8px} }
    </style>
</head>
<body>

    <header>
        <div class="control-group">
            <div>
                <label>코인 심볼</label><br>
                <input type="text" id="symbolInput" value="AKEUSDT">
            </div>
            <div>
                <label>거래소</label><br>
                <select id="exchangeSelect">
                    <option value="BINANCE" selected>Binance</option>
                    <option value="BYBIT">Bybit</option><option value="BINGX">BingX</option><option value="BITGET">Bitget</option><option value="MEXC">MEXC</option><option value="OKX">OKX</option>
                </select>
            </div>
            <div>
                <label>봉 주기</label><br>
                <select id="intervalSelect">
                    <option value="15m">15분 </option>
                    <option value="1h">1시간 </option>
                    <option value="4h" selected>4시간</option>
                    <option value="1d">1일 (일봉)</option>
                </select>
            </div>
            <div>
                <label>1차 경고(%)</label><br>
                <input type="number" id="warnThresh" value="-0.5" step="0.001">
            </div>
            <div>
                <label>극단 경고(%)</label><br>
                <input type="number" id="extThresh" value="-2.0" step="0.001">
            </div>
            <div style="align-self: flex-end;">
                <button id="searchBtn">검색 / 새로고침</button>
            </div>
        </div>

        <div class="control-group">
            <div>
                <label>보기 설정</label><br>
                <div style="display: flex; gap: 4px;">
                    <button id="btnToggleLines" class="btn-toggle active" title="세로줄 가이드 켜기/끄기">👁️ 세로줄</button>
                    <button id="btnAutoFit" class="btn-toggle active" title="자동 정렬 & 화면 포커싱">A</button>
                    <button id="btnLogScale" class="btn-toggle" title="로그 스케일 토글">L</button><button id="btnRuler" class="btn-toggle" title="시작 가격과 끝 가격을 클릭해 변동률 측정">📏 줄자</button>
                </div>
            </div>
            <div id="status-msg">준비 완료</div>
        </div>
    </header>

    <div id="main-wrapper">
        <div id="chart-container">
          <div id="chart-key" style="padding:6px 12px;font-size:12px;min-height:28px">가격 · 거래량 · 펀딩비(%) · 정산 주기(시간) — 동일 시간축</div>
          <div id="unified-chart" style="flex:1;min-height:0;position:relative"></div>
          <div style="padding:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px">
            <button id="oldestBtn">최초 데이터</button><button id="latestBtn">최근 데이터</button>
            <input id="historyPosition" type="range" min="0" max="0" value="0" style="flex:1;min-width:100px">
            <button id="stopBtn">수집 중지</button><span id="historyInfo"></span>
          </div>
          <div id="coverage" style="padding:4px 12px;font-size:11px;color:#9ca3af"></div>
          <a href="https://www.tradingview.com/" target="_blank" rel="noopener" style="padding:4px 12px;font-size:10px;color:#9ca3af">Charts by TradingView</a>
        </div>

        <!-- ⚡ 발생 신호 목록 패널 -->
        <div id="signal-sidebar">
            <div class="sidebar-header">
                ⚡ 펀딩비 발생 신호 목록
                <span id="signalCountTag">0개</span>
            </div>
            <div class="signal-list" id="signalListContainer">
                <div style="color: #9ca3af; font-size: 12px; text-align: center; padding: 20px;">
                    검색을 실행하면 여기에 발생한 신호 목록이 생성됩니다.
                </div>
            </div>
        </div>
    </div>

    <script src="app.js?v=20261007-funding-cycle-5"></script>
</body>
</html>
