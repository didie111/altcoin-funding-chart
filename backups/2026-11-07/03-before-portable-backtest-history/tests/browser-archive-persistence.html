<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>개발 검증 · 펀딩 이력 저장과 새로고침</title><link rel="stylesheet" href="../funding-archive.css"><style>body{background:#101a29;color:#d7e7ff;font:14px/1.7 system-ui;margin:20px}main{display:flex;gap:24px;align-items:flex-start}#signal-sidebar{width:370px;min-width:320px;height:850px;display:flex;flex-direction:column;border:1px solid #425e82}#tab-funding-history{display:flex;flex-direction:column;flex:1;min-height:0}button{cursor:pointer}body>button{padding:12px;margin:0 8px 16px 0;background:#234d76;color:white;border:1px solid #659bd0;border-radius:6px}pre{white-space:pre-wrap;max-width:650px}.pass{color:#81e1b7}.fail{color:#ffa6ad}@media(max-width:760px){main{flex-direction:column}body{margin:8px}}</style><h1>개발 검증 · 예제 자료</h1><p>격리된 테스트 저장소만 사용합니다. 이전 날짜 검색 복원·중단 위치·0건 계약·새로고침 후 증분 갱신을 검증합니다. 실제 거래 자료가 아닙니다.</p><button id="verify">저장·복원·증분 검증 실행</button><button id="reload">페이지 새로고침</button><main><section id="signal-sidebar"><nav class="sidebar-tab-bar"></nav></section><pre id="results" role="status">준비 중…</pre></main><script src="../funding.js"></script><script src="../timeframes.js"></script><script src="../indicators.js"></script><script src="../backtest-bars.js"></script><script src="../backtest-engine.js"></script><script src="../funding-archive.js"></script><script src="../dashboard-model.js"></script><script src="../list-navigation.js"></script><script src="../funding-archive-ui.js"></script><script>
(async()=>{
 const isolated={open:(name,v)=>indexedDB.open(name+'-qa-persistent-resume-20261031-v2',v)},store=await FundingArchive.storage(isolated),config=FundingArchive.options(),key=FundingArchive.familyKey(config),all=await store.allRuns(),row=(time,rate=-.6)=>({time,rate,intervalHours:1,intervalSource:'official-history'}),markets=['AKEUSDT','BTCUSDT','ZEROUSDT'].map(symbol=>({exchange:'BINANCE',symbol}));let legacy=all.find(r=>r.id==='qa-previous-day');
 if(!legacy){const to=Math.floor(Date.now()/3600000)*3600-7200,base=to-100*3600;legacy={key:JSON.stringify({...config,day:12345}),id:'qa-previous-day',config,to,createdAt:to*1000,markets:markets.map(m=>({...m,listedAt:base}))};await store.putRun(legacy);for(const m of legacy.markets){const head=[3,2,1].map(h=>row(to-h*3600,m.symbol!=='AKEUSDT'?.01:-.6));await store.save(legacy.id,m,{status:m.symbol==='ZEROUSDT'?'partial':'done',pages:20,records:100,page:21,cursor:(base+50*3600)*1000,first:base,last:to-3600,neighbors:head},m.symbol==='AKEUSDT'?head.map(r=>({time:r.time,rate:r.rate,hours:1,source:'official-history'})):[]);}}
 FundingArchive.storage=async()=>store;const prefKey='funding-chart-history-filters-v1',pref=localStorage.getItem(prefKey);localStorage.removeItem(prefKey);let requests=[];
 FundingArchiveUI.bind({document,catalog:{load:async()=>({rows:legacy.markets})},page:async(ex,symbol,cursor)=>{requests.push({symbol,cursor});if(symbol!=='ZEROUSDT')throw Error('완료 코인의 과거를 다시 요청했습니다.');const t=Math.floor(Date.now()/1000);return [row(t-3600),row(t)].filter(r=>r.time*1000>=cursor);},binancePage:async(start,end)=>{requests.push({bulk:true,start,end});const times=[end-7200000,end-3600000,end],raw=['AKEUSDT','BTCUSDT'].flatMap(symbol=>times.map(fundingTime=>({symbol,fundingTime,fundingRate:'-0.006'})));return FundingArchive.binanceBatch(raw,end);},loadMarket(){}});if(pref!==null)localStorage.setItem(prefKey,pref);
 const $=id=>document.getElementById(id),wait=async fn=>{const deadline=Date.now()+15000;while(!fn()){if(Date.now()>deadline)throw Error('UI 대기 시간 초과');await new Promise(r=>setTimeout(r,25));}},check=(yes,message)=>{if(!yes)throw Error(message);return '통과 · '+message;};await wait(()=>$('fhStatus').textContent.includes('복원'));document.querySelector('.fh-filters').open=false;const restored=await store.states(key);$('results').textContent='실제 IndexedDB 복원 완료\n'+restored.length+'개 계약 / '+restored.reduce((n,s)=>n+s.matches,0)+'건 / HTTP 요청 '+requests.length+'회\n새로고침해도 이 결과가 유지됩니다.';$('reload').onclick=()=>location.reload();
 $('verify').onclick=async()=>{const lines=[];try{const before=await store.states(key),zero=before.find(s=>s.symbol==='ZEROUSDT');lines.push(check(store.persistent,'실제 IndexedDB 사용'));lines.push(check(before.length===3,'예전 날짜·모든 거래소 결과에서 계약3개 복원'));lines.push(check(before.some(s=>s.symbol==='BTCUSDT'&&s.status==='done'),'0건으로 끝낸 코인도 체크포인트 보존'));lines.push(check(requests.length===0,'새로고침 복원에 API 요청0회'));const expectedCursor=zero.cursor;$('fhFresh').click();await wait(()=>$('fhStop').hidden);const after=await store.states(key),events=await store.query(key,{exchange:'BINANCE',size:100});lines.push(check(after.every(s=>s.status==='done'),'미완료 구간·신규 정산 검토 완료'));lines.push(check(events.rows.length>=7,'과거 결과와 새 정산을 함께 보존'));if(zero.status!=='done')lines.push(check(requests[0].cursor===expectedCursor,'중단했던 정확한 커서부터 재개'));lines.push(check(requests.some(r=>r.bulk),'완료 코인은 Binance 묶음 갱신 사용'));const r=await FundingArchive.create({store}).restore({...config,exchange:'BINANCE'});lines.push(check(r.states.length===3&&r.run.id===key,'모든 거래소→Binance 변경 후 같은 저장본 재사용'));lines.push(check((await store.query(legacy.id,{size:100})).rows.length===3,'기존 날짜별 원본도 보존'));$('results').className='pass';$('results').textContent=lines.join('\n')+'\n실제 증분 요청 '+requests.length+'회\n페이지 새로고침 후 결과가 그대로 보이는지 확인하세요.';}catch(error){$('results').className='fail';$('results').textContent=lines.join('\n')+'\n실패 · '+error.stack;}};
})().catch(error=>{document.getElementById('results').className='fail';document.getElementById('results').textContent=error.stack;});
