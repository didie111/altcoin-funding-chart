<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>백업 저장·복원 브라우저 검증</title><style>body{background:#101c2d;color:#dae9fc;font:15px/1.8 system-ui;margin:24px;max-width:900px}button,input{font:inherit;margin:8px 8px 8px 0;padding:10px;border-radius:6px}button{background:#25588c;color:white;border:1px solid #6c9aca;cursor:pointer}.pass{color:#83dfb0}.fail{color:#ffaaa7}pre{white-space:pre-wrap;background:#1b2b40;padding:16px;border:1px solid #45617e}</style>
<h1>백업 저장·복원 검증</h1><p>격리된 예제 자료입니다. 실제 코인 가격이나 성과가 아닙니다. 사용자의 즐겨찾기·시장자료 저장소에는 접근하지 않습니다.</p><button id="run">IndexedDB·파일 검증 실행</button><button id="download" disabled>예제 백업 다운로드</button><label>다운로드 파일 재검증<input id="restore" type="file" accept=".dat,.json"></label><pre id="result">검증 준비</pre>
<script src="../timeframes.js"></script><script src="../backtest-cache.js"></script><script src="../coin-favorites.js"></script><script src="../backtest-backup.js"></script><script>
const $=id=>document.getElementById(id),assert=(ok,message)=>{if(!ok)throw Error(message);},request=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);}),lines=[];let exported;
function storage(){const map=new Map();return {getItem:k=>map.get(k),setItem:(k,v)=>map.set(k,v)};}
const bars=Array.from({length:10},(_,i)=>({time:1700000000+i*60,open:.0000012345678901+i,high:10+i,low:0,close:1+i,volume:50.25+i}));
$('run').onclick=async()=>{lines.length=0;try{
 const id='qa-backup-'+Date.now();
 // Build the legacy v1 schema under a unique, disposable test-only name.
 const legacy=await request(Object.assign(indexedDB.open(id+'-legacy',1),{onupgradeneeded(event){const d=event.target.result,p=d.createObjectStore('pages',{keyPath:'key'});p.createIndex('touched','touched');d.createObjectStore('meta',{keyPath:'key'});d.createObjectStore('jobs',{keyPath:'id'}).createIndex('updated','updated');}}));
 const job={id:'backup-example',updated:1,status:'paused',config:{timeframe:'3m',minFundingRate:-.6,entryCooldownBars:150},items:[{exchange:'BINANCE',symbol:'AKEUSDT',status:'done',summary:{netPnl:12}}]},tx=legacy.transaction(['pages','meta','jobs'],'readwrite');
 for(let i=0;i<3;i++)tx.objectStore('pages').put({key:'old-'+i,data:BacktestCache.packCandles(Array.from({length:70},(_,n)=>({...bars[n%10],time:1700000000+n*60}))),bytes:1,expires:Date.now()+(i===2?-1:86400000),touched:i});tx.objectStore('meta').put({key:'bytes',value:3});tx.objectStore('jobs').put(job);await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});legacy.close();
 const source=await BacktestCache.open({indexedDB:{open:(n,v)=>indexedDB.open(id+'-legacy',v)},limit:4096}),info=await source.info();assert(info.persistent&&info.bytes>3000&&info.bytes<=4096,'v1 이전 또는 실제 용량 계산 실패');assert((await source.keys()).length===1,'만료·LRU 처리 실패');assert((await source.latestJob()).id===job.id,'진행 결과 소실');lines.push('통과 · 기존 v1 저장소 이전 · 실제 바이트 한도 · 최근 결과 보존');
 await source.put('roundtrip',BacktestCache.packCandles(bars));const favorites=CoinFavorites.create({storage:storage()});favorites.change(['BINANCE:AKEUSDT','BYBIT:BTCUSDT'],true);exported={...await source.exportAll(),favorites:favorites.snapshot().keys};const file=await BacktestBackup.blob(exported);exported=JSON.parse(await file.text());
 const target=await BacktestCache.open({indexedDB:{open:(n,v)=>indexedDB.open(id+'-restored',v)},limit:4096}),existing=CoinFavorites.create({storage:storage()});existing.change(['MEXC:SNTUSDT'],true);await BacktestBackup.restore(exported,{store:target,favorites:existing,parseKey:CoinFavorites.parseKey});assert(existing.snapshot().size===3,'즐겨찾기 병합 실패');assert((await target.latestJob()).config.entryCooldownBars===150,'전략 설정 복원 실패');assert(JSON.stringify(BacktestCache.unpackCandles(await target.get('roundtrip')))===JSON.stringify(bars),'Float64 원본 변경');lines.push('통과 · JSON/Blob 왕복 · 즐겨찾기 병합 · 전략·결과·정밀 가격 복원');
 const bytes=(await target.info()).bytes;await BacktestBackup.restore(exported,{store:target,favorites:existing,parseKey:CoinFavorites.parseKey});assert((await target.info()).bytes===bytes,'중복 복원 용량 증가');lines.push('통과 · 중복 복원 용량 유지');$('download').disabled=false;$('result').className='pass';$('result').textContent=lines.join('\n');
}catch(e){$('result').className='fail';$('result').textContent=lines.join('\n')+'\n실패 · '+e.stack;}};
$('download').onclick=async()=>{try{const result=await BacktestBackup.save({environment:{Blob,URL,document,setTimeout:(fn,ms)=>window.setTimeout(fn,ms)},readBackup:async()=>exported});$('result').textContent+='\n다운로드 시작 · '+result.favorites+'개 즐겨찾기 · '+result.bytes+'바이트';}catch(e){$('result').textContent+='\n실패 · '+e.message;}};
$('restore').onchange=async()=>{try{const p=JSON.parse(await $('restore').files[0].text()),target=BacktestCache.memory(),favorites=CoinFavorites.create();await BacktestBackup.restore(p,{store:target,favorites,parseKey:CoinFavorites.parseKey});assert(favorites.snapshot().size===2&&(await target.latestJob()).id==='backup-example','다운로드 파일 내용 불일치');$('result').textContent+='\n통과 · 실제 다운로드 파일 다시 읽기 · 목록·결과·설정 복원';}catch(e){$('result').textContent+='\n실패 · '+e.message;}};
</script></html>
